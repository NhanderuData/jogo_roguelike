[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rogue-llama"
version = "0.1.0"
description = "A data-driven Pygame roguelike"
requires-python = ">=3.10"
dependencies = [
    "perlin-noise==1.14",
    "pygame==2.6.1",
]

[project.optional-dependencies]
dev = ["Pillow>=10"]

[project.scripts]
rogue-llama = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["debug", "main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/rogue-llama/assets" = ["assets/*.png"]
"share/rogue-llama/assets/data" = ["assets/data/*.json"]
"share/rogue-llama/assets/generated" = ["assets/generated/*.png"]
"share/rogue-llama/assets/sprites" = ["assets/sprites/*.png"]
"share/rogue-llama/assets/sprites/pixel_crawler" = [
    "assets/sprites/pixel_crawler/*.png",
    "assets/sprites/pixel_crawler/LICENSE.txt",
]
"share/rogue-llama/assets/sprites/pixel_crawler/nature" = [
    "assets/sprites/pixel_crawler/nature/*.png",
]
